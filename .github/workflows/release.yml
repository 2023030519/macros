# Al subir a main con una "version" nueva en package.json: prueba, compila el APK y publica el release.
# La app lo encuentra en Configuración → Actualizaciones.
name: Release APK

on:
  push:
    branches: [main]
    # la app escribe ahí los cambios de la base compartida; no hace falta compilar por eso
    paths-ignore: ["data/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: ¿Versión nueva?
        id: v
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then echo "nueva=no" >> "$GITHUB_OUTPUT"; else echo "nueva=si" >> "$GITHUB_OUTPUT"; fi

      - if: steps.v.outputs.nueva == 'si'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - if: steps.v.outputs.nueva == 'si'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - if: steps.v.outputs.nueva == 'si'
        name: Notas del CHANGELOG
        run: node scripts/notas.mjs > notas.md

      - if: steps.v.outputs.nueva == 'si'
        run: npm ci && npm test && npm run build && npx cap sync android

      # Misma llave que el APK instalado en el cel; con otra, Android no deja actualizar.
      - if: steps.v.outputs.nueva == 'si'
        name: Llave de firma
        run: |
          if [ -z "$DEBUG_KEYSTORE" ]; then echo "::error::Falta el secreto DEBUG_KEYSTORE (ver CLAUDE.md)"; exit 1; fi
          echo "$DEBUG_KEYSTORE" | base64 -d > "$RUNNER_TEMP/macros.keystore"
          echo "MACROS_KEYSTORE=$RUNNER_TEMP/macros.keystore" >> "$GITHUB_ENV"
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}

      - if: steps.v.outputs.nueva == 'si'
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      # Huella de la llave del APK instalado en el cel; si no coincide, no se publica.
      - if: steps.v.outputs.nueva == 'si'
        name: Revisar firma
        run: |
          firma=$("$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -m1 'SHA-256' | awk '{print $NF}')
          echo "firma: $firma"
          [ "$firma" = "db9be13279ba9716551518421a9e95dd0f0da1585b2a2ecd7125be49bfc5aad0" ] || { echo "::error::El APK no está firmado con la llave del cel"; exit 1; }

      - if: steps.v.outputs.nueva == 'si'
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk macros.apk
          gh release create "v${{ steps.v.outputs.version }}" macros.apk --title "MacrOS ${{ steps.v.outputs.version }}" --notes-file notas.md
